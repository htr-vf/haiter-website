  <meta charset="UTF-8" />

  <title>Haiter Intelligence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .logo {
      width: 820px;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, .5));
    }

    .contact {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      text-align: center;
      color: white;
      letter-spacing: 2px;
    }

    .contact a {
      color: #f2f2eb;
      text-decoration: none;
      font-size: 12px;
      transition: 0.3s;
      padding: 6px calc(8px - 2px) 6px 8px;
      text-align: center
    }

    .contact a:hover {
      background: #f2f2eb;
      color: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, .5) 100%);
      z-index: 1;
    }
